<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Формы</title>
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="viewport form-flex">
    <form class="form">
    <fieldset class="fieldset-first">
      <legend class="form-title">Ваши личные данные</legend>
      <label class="form-title_group">
        <div class="form-title_input">Ваше имя</div>
        <input class="form-input_border" type="text" placeholder="Имя" name="name" required>
      </label>
      <label class="form-title_group">
        <div class="form-title_input">Ваш возраст</div>
        <input class="form-input_border" type="number" placeholder="Возраст" inputmode="numeric" name="age" required>
      </label>
      <label class="form-title_group">
        <div class="form-title_input">Ваш номер телефона</div>
        <input class="form-input_border" type="tel" placeholder="Номер телефона" name="phone" inputmode="tel" required>
      </label>
      <label class="form-title_group">
        <div class="form-title_input">Ваша почта</div>
        <input class="form-input_border" type="email" placeholder="Почта" name="email" inputmode="email" required>
      </label>
    </fieldset>
    <fieldset class="fieldset-last">
      <label class="form-title_group">
        <div class="form-title_input">Сообщение</div>
        <textarea class="form-input_textarea" placeholder="Ваше сообщение" required></textarea>
      </label>
      <label class="checkbox">
        <input class="checkbox-input" type="checkbox" required>
        <span class="checkbox-text">Я принимаю правила</span>
      </label>
      <button class="button">Отправить</button>
      </fieldset>
    </form>
  </div>
</body>
</html>
